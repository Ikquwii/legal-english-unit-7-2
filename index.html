['trespass','неправомерное вторжение','tort',0,'Прямое неправомерное вмешательство во владение землёй, имуществом или личную сферу.','hard'],
['conversion','неправомерное присвоение чужого движимого имущества','tort',0,'Серьёзное вмешательство в право собственника на движимую вещь.','hard'],
['tort against the person','деликт против личности','tort',0,'Деликт, посягающий на физическую свободу или неприкосновенность лица.','hard'],
['property tort','имущественный деликт','tort',0,'Деликт, причиняющий вред имуществу или владению.','medium'],
['dignitary tort','деликт против чести, достоинства или репутации','tort',0,'Деликт, защищающий личное достоинство, репутацию и частную сферу.','hard'],
['economic tort','экономический деликт','tort',0,'Деликт, причиняющий чисто экономический вред или нарушающий деловые отношения.','hard'],
['to claim damages','требовать возмещения убытков','tort',0,'Заявлять требование о денежном возмещении вреда.','medium'],
['to award damages','присудить возмещение убытков','tort',0,'Определить судебным решением сумму денежного возмещения.','medium'],
// Employment law — 22
['employment law','трудовое право','employment',0,'Совокупность норм, регулирующих отношения работников и работодателей.','easy'],
['employment standards','трудовые стандарты','employment',0,'Минимальные установленные законом условия труда и гарантии работников.','medium'],
['employer','работодатель','employment',0,'Лицо или организация, нанимающие работника.','easy'],
['employee','работник','employment',0,'Лицо, выполняющее работу по трудовому договору.','easy'],
['worker’s rights','права работника','employment',0,'Закреплённые законом и договором трудовые права и гарантии.','easy'],
['worker’s responsibilities','обязанности работника','employment',0,'Обязанности по выполнению работы и соблюдению правил работодателя.','easy'],
['wage','заработная плата; ставка оплаты труда','employment',0,'Вознаграждение за труд, часто рассчитываемое по часам или дням.','easy'],
['benefit','льгота; выплата; социальная гарантия','employment',0,'Дополнительное к зарплате преимущество или выплата работнику.','easy'],
['wage benefit','денежная выплата работнику','employment',0,'Предусмотренная трудовыми нормами выплата, связанная с оплатой труда.','medium'],
['leave benefit','гарантия или выплата на период отпуска','employment',0,'Право на оплачиваемый либо защищённый законом отпуск.','medium'],
['night shift differential','доплата за работу в ночную смену','employment',0,'Повышенная оплата за часы работы в ночное время.','hard'],
['collective bargaining','коллективные переговоры','employment',0,'Переговоры работодателя и представителей работников об условиях труда.','hard'],
['compensable','подлежащий оплате или компенсации','employment',0,'Такой, за который работник имеет право получить оплату или возмещение.','hard'],
['overtime pay','оплата сверхурочной работы','employment',0,'Повышенная оплата за работу сверх установленной продолжительности.','easy'],
['maternity leave','отпуск по беременности и родам','employment',0,'Гарантированный период освобождения от работы в связи с рождением ребёнка.','easy'],
['minimum wage','минимальный размер оплаты труда','employment',0,'Минимальная ставка, ниже которой закон запрещает оплачивать труд.','easy'],
['work break','перерыв в работе','employment',0,'Предусмотренный период отдыха в течение рабочего времени.','easy'],
['to terminate employment','прекратить трудовые отношения; уволить','employment',0,'Завершить трудовой договор по инициативе одной из сторон или иному основанию.','medium'],
['termination compensation','выплата при прекращении трудовых отношений','employment',0,'Компенсация или выходное пособие, причитающиеся при увольнении.','hard'],
['to file a complaint','подать жалобу','employment',0,'Официально обратиться с заявлением о нарушении трудовых прав.','medium'],
['filing period','срок подачи жалобы или иска','employment',0,'Установленный период, в течение которого допускается подача требования.','hard'],
['Labor Code','трудовой кодекс','employment',0,'Кодифицированный закон, регулирующий трудовые отношения.','easy']
].map((x,i)=>({id:i+1,term:x[0],ru:x[1],topic:x[2],book:!!x[3],def:x[4],level:x[5],note:x[6]||''}));

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const topicName={contract:'Contract law',tort:'Tort law',employment:'Employment law'};
const key='legal72-known-v1';
let known=new Set(JSON.parse(localStorage.getItem(key)||'[]'));
let mode='cards',filter='all',query='',pool=[],idx=0,flipped=false,quiz=null,matchState=null;
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-zа-яё0-9]+/gi,' ').trim();
const save=()=>{localStorage.setItem(key,JSON.stringify([...known]));updateMeta()};
function refreshPool(resetIndex=true){
  pool=TERMS.filter(t=>filter==='all'||filter==='book'&&t.book||['contract','tort','employment'].includes(filter)&&t.topic===filter||filter==='known'&&known.has(t.id)||filter==='unknown'&&!known.has(t.id)).filter(t=>!query||norm(t.term+' '+t.ru).includes(norm(query)));
  if(resetIndex)idx=0; if(idx>=pool.length)idx=0; render();
}
function updateMeta(){
  $('#count').textContent=`${pool.length} терминов · выучено ${known.size} из ${TERMS.length}`;
  $('#bar').style.width=`${known.size/TERMS.length*100}%`;
}
function bookTag(t){return t.book?'<span class="booktag">список учебника</span>':''}
function render(){updateMeta();const v=$('#view');if(!pool.length){v.innerHTML='<div class="empty">По этому фильтру карточек нет.</div>';return}if(mode==='cards')renderCards();if(mode==='learn')renderLearn();if(mode==='match')renderMatch();if(mode==='test')renderTest();if(mode==='write')renderWrite()}
function renderCards(){const t=pool[idx];flipped=false;$('#view').innerHTML=`
  <section class="card" id="card" tabindex="0" role="button" aria-label="Перевернуть карточку"><div class="inner">
    <article class="face"><span class="label">${topicName[t.topic]} · ${idx+1}/${pool.length}</span>${bookTag(t)}<div class="term">${t.term}</div><div class="hint">нажмите, чтобы увидеть перевод</div></article>
    <article class="face back"><span class="label">Юридический перевод</span>${bookTag(t)}<div class="translation">${t.ru}</div><div class="definition">${t.def}</div>${t.note?`<div class="source-note">${t.note}</div>`:''}<div class="hint">нажмите, чтобы вернуться</div></article>
  </div></section>
  <div class="actions"><button class="btn" id="prev">← Назад</button><button class="btn" id="speak" aria-label="Произнести">🔊</button><button class="btn" id="next">Дальше →</button></div>
  <div class="judge"><button class="btn bad" id="again">Ещё раз</button><button class="btn good" id="know">${known.has(t.id)?'✓ Выучено':'Знаю'}</button></div>`;
  const card=$('#card'),flip=()=>{flipped=!flipped;card.classList.toggle('flip',flipped)};card.onclick=flip;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  $('#prev').onclick=()=>{idx=(idx-1+pool.length)%pool.length;renderCards()};$('#next').onclick=()=>{idx=(idx+1)%pool.length;renderCards()};
  $('#speak').onclick=e=>{e.stopPropagation();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.term.replace('to ',''));u.lang='en-GB';speechSynthesis.speak(u)};
  $('#again').onclick=()=>{known.delete(t.id);save();idx=(idx+1)%pool.length;renderCards()};$('#know').onclick=()=>{known.add(t.id);save();idx=(idx+1)%pool.length;renderCards()};
}
function choicesFor(t){return [t,...TERMS.filter(x=>x.id!==t.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5)}
function renderLearn(){const t=pool[idx];if(!quiz||quiz.id!==t.id)quiz={id:t.id,done:false,opts:choicesFor(t)};$('#view').innerHTML=`<div class="panel"><div class="qtag">Выберите юридический перевод · ${idx+1}/${pool.length}</div><div class="question">${t.term}</div><div class="options">${quiz.opts.map(o=>`<button class="option" data-id="${o.id}">${o.ru}</button>`).join('')}</div><div class="feedback" id="fb"></div></div>`;$$('.option').forEach(b=>b.onclick=()=>{if(quiz.done)return;quiz.done=true;const ok=+b.dataset.id===t.id;b.classList.add(ok?'correct':'wrong');$$('.option').find(x=>+x.dataset.id===t.id)?.classList.add('correct');$('#fb').className='feedback '+(ok?'good':'bad');$('#fb').textContent=ok?'Верно. Переходим дальше…':`Правильно: ${t.ru}`;if(ok){known.add(t.id);save()}setTimeout(()=>{idx=(idx+1)%pool.length;quiz=null;renderLearn()},ok?650:1500)})}
function newMatch(){const src=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(6,pool.length));const tiles=[...src.map(t=>({id:t.id,side:'en',text:t.term})),...src.map(t=>({id:t.id,side:'ru',text:t.ru}))].sort(()=>Math.random()-.5);matchState={tiles,sel:null,hits:0,start:Date.now(),done:false};}
function renderMatch(){if(!matchState||matchState.done)newMatch();const m=matchState;$('#view').innerHTML=`<div class="panel"><div class="matchhead"><div><div class="qtag">Соедините пары</div><div class="tiny">Сначала термин, затем перевод — или наоборот.</div></div><div class="timer" id="timer">0:00</div></div><div class="matchgrid">${m.tiles.map((x,i)=>`<button class="tile ${x.hit?'matched':''}" data-i="${i}">${x.text}</button>`).join('')}</div><div class="feedback" id="fb">Найдено: ${m.hits}/${m.tiles.length/2}</div></div>`;const tick=()=>{const el=$('#timer');if(!el||m.done)return;const s=Math.floor((Date.now()-m.start)/1000);el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;setTimeout(tick,1000)};tick();$$('.tile').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,x=m.tiles[i];if(x.hit)return;if(m.sel===null){m.sel=i;b.classList.add('selected');return}const a=m.tiles[m.sel];if(a.id===x.id&&a.side!==x.side){a.hit=x.hit=true;m.hits++;m.sel=null;if(m.hits===m.tiles.length/2){m.done=true;m.tiles.filter(z=>z.side==='en').forEach(z=>known.add(z.id));save();renderMatchDone()}else renderMatch()}else{m.sel=null;b.classList.add('wrong');$('#fb').className='feedback bad';$('#fb').textContent='Не пара — попробуйте ещё раз.';setTimeout(renderMatch,450)}})}
function renderMatchDone(){const s=Math.floor((Date.now()-matchState.start)/1000);$('#view').innerHTML=`<div class="panel summary"><div class="score">${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}</div><h2>Раунд собран</h2><p class="sub">6 пар добавлены в выученные.</p><button class="btn primary" id="againMatch">Ещё раунд</button></div>`;$('#againMatch').onclick=()=>{matchState=null;renderMatch()}}
function renderTest(){if(!quiz||quiz.kind!=='test'){const n=Math.min(10,pool.length),qs=[...pool].sort(()=>Math.random()-.5).slice(0,n);quiz={kind:'test',qs,pos:0,score:0,opts:null,done:false}}if(quiz.done){$('#view').innerHTML=`<div class="panel summary"><div class="score">${quiz.score}/${quiz.qs.length}</div><h2>${quiz.score===quiz.qs.length?'Без ошибок':quiz.score>=quiz.qs.length*.7?'Хороший результат':'Стоит повторить'}</h2><button class="btn primary" id="retry">Пройти ещё раз</button></div>`;$('#retry').onclick=()=>{quiz=null;renderTest()};return}const t=quiz.qs[quiz.pos];if(!quiz.opts)quiz.opts=choicesFor(t);$('#view').innerHTML=`<div class="panel"><div class="qtag">Тест · вопрос ${quiz.pos+1}/${quiz.qs.length}</div><div class="question">${t.term}</div><div class="options">${quiz.opts.map(o=>`<button class="option" data-id="${o.id}">${o.ru}</button>`).join('')}</div><div class="feedback" id="fb"></div></div>`;$$('.option').forEach(b=>b.onclick=()=>{if(quiz.lock)return;quiz.lock=true;const ok=+b.dataset.id===t.id;b.classList.add(ok?'correct':'wrong');$$('.option').find(x=>+x.dataset.id===t.id)?.classList.add('correct');if(ok){quiz.score++;known.add(t.id);save()}$('#fb').className='feedback '+(ok?'good':'bad');$('#fb').textContent=ok?'Верно':`Правильно: ${t.ru}`;setTimeout(()=>{quiz.pos++;quiz.opts=null;quiz.lock=false;if(quiz.pos>=quiz.qs.length)quiz.done=true;renderTest()},ok?600:1300)})}
function acceptedAnswers(t){return t.term.split('/').map(norm).concat(t.term.replace(/^to /,'').split('/').map(norm))}
function renderWrite(){const t=pool[idx];$('#view').innerHTML=`<div class="panel"><div class="qtag">Напишите термин по-английски · ${idx+1}/${pool.length}</div><div class="question">${t.ru}</div><form id="writeForm"><input class="writeinput" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="English term…"><div class="writeactions"><button class="btn primary" type="submit">Проверить</button><button class="btn" type="button" id="skip">Не знаю</button></div></form><div class="feedback" id="fb"></div></div>`;const input=$('#answer');input.focus();$('#writeForm').onsubmit=e=>{e.preventDefault();const ok=acceptedAnswers(t).includes(norm(input.value));$('#fb').className='feedback '+(ok?'good':'bad');$('#fb').textContent=ok?'Верно':`Правильно: ${t.term}`;if(ok){known.add(t.id);save()}input.disabled=true;setTimeout(()=>{idx=(idx+1)%pool.length;renderWrite()},ok?650:1500)};$('#skip').onclick=()=>{$('#fb').className='feedback bad';$('#fb').textContent=`Правильно: ${t.term}`;setTimeout(()=>{idx=(idx+1)%pool.length;renderWrite()},1200)}}
$('#modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;$$('#modes button').forEach(x=>x.classList.toggle('on',x===b));quiz=null;matchState=null;idx=0;render()};
$('#filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;$$('#filters button').forEach(x=>x.classList.toggle('on',x===b));quiz=null;matchState=null;refreshPool()};
$('#search').oninput=e=>{query=e.target.value;quiz=null;matchState=null;refreshPool()};
$('#shuffle').onclick=()=>{pool.sort(()=>Math.random()-.5);idx=0;quiz=null;matchState=null;render()};
$('#reset').onclick=()=>{if(confirm('Сбросить все отметки «выучено»?')){known.clear();save();refreshPool(false)}};
document.addEventListener('keydown',e=>{if(mode!=='cards'||!pool.length||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){idx=(idx+1)%pool.length;renderCards()}if(e.key==='ArrowLeft'){idx=(idx-1+pool.length)%pool.length;renderCards()}if(e.key===' '){e.preventDefault();$('#card')?.click()}});
refreshPool();
</script>
</body>
</html>
